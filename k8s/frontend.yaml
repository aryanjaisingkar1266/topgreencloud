apiVersion: apps/v1
kind: Deployment
metadata:
  name: topgreencloud-frontend
  namespace: topgreencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topgreencloud-frontend
  template:
    metadata:
      labels:
        app: topgreencloud-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/topgreencloud-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: topgreencloud-frontend
  namespace: topgreencloud
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: topgreencloud-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
